name: CI

# Lint, typecheck, test, and build on every PR. No `push: main` run: the PR
# run already checked the change, and publish.yml re-runs the same gate on the
# `v*` tag before it publishes, so nothing reads a run on main. The PR run
# tests the PR merged onto main as it was then; to check main itself (after
# two PRs land back to back, or a direct push), run this by hand
# (workflow_dispatch).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the publish/runtime target; 22 is the local dev version.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # No version here — it is pinned by package.json `packageManager`, and
        # action-setup errors if both are set.
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Build npm artifact
        run: pnpm run build:npm

      - name: Smoke test the bundle
        run: node bundles/npm/cc-audit.mjs --help
